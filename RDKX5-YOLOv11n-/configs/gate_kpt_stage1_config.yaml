# R3（2026-09-26）：照 auv4 那代的做法 —— 校准集换成 **240 张『真有门』且与本代链路同分布**的帧
#     （calibration_data_gate240_stage1_rgb：阶段一训练集有门帧 160 + 中水 80），其余设置与 R1 完全相同。
# ⚠️ 本文件用于 **阶段一权重**（`weights/new/yolo11n-pose.stage1.onnx`，2026-09-26 新建）。
#    产线（旧版）仍用 configs/gate_kpt_config.yaml → output/weights/gate_kpt_bayese_640x640_nv12.bin
#    校准集：calibration_data/（2026-09-26 重建：清水 70 + 中水 50 + 无门 15 = 135 张，均为 640×640 D+wb）
# ============================================
# YOLO11n-pose【阶段一 yolo11n-pose.stage1】RDK X5 PTQ 量化配置
# 输出：9 个 NHWC 张量（3 尺度 × bbox64/cls nc/kpt12），供板端 gate/gate_decode.py
# ============================================
model_parameters:
  # 由 export_onnx.py --task pose 导出（模型名 yolo11n-pose.pt → yolo11n-pose.onnx）
  onnx_model: '/data/weights/new/yolo11n-pose.stage1.onnx'

  march: 'bayes-e'                       # RDK X5 = bayes-e

  working_dir: '/data/output'
  output_model_file_prefix: 'gate_kpt_stage1_g240_i16_bayese_640x640_nv12'

  # 【核心】C2PSA 的 Softmax 指定到 BPU（int16），避免 CPU 子图导致性能暴跌。
  # pose 与 detect 共用同一 backbone，节点名通常一致；
  # 若 hb_mapper 报找不到该节点，用 `hb_mapper checker` 查实际 Softmax 名后修改。
  # R4（2026-09-26）：在 R3 基础上，把 head 末端 4 个卷积（bbox×2 + kpt×2）指定 int16 ——
  #   它们正是余弦最低的输出（6/3 = bbox64、8/5 = kpt12）的直接来源。
  #   代价：这几个节点算力上升（head 卷积本身很小，预期影响有限），**上板必须复测帧率**。
  node_info: {
    "/model.10/m/m.0/attn/Softmax": {
      'ON': 'BPU',
      'InputType': 'int16',
      'OutputType': 'int16'
    },
    "/model.23/cv2.1/cv2.1.2/Conv": { 'ON': 'BPU', 'InputType': 'int16', 'OutputType': 'int16' },
    "/model.23/cv2.2/cv2.2.2/Conv": { 'ON': 'BPU', 'InputType': 'int16', 'OutputType': 'int16' },
    "/model.23/cv4.1/cv4.1.2/Conv": { 'ON': 'BPU', 'InputType': 'int16', 'OutputType': 'int16' },
    "/model.23/cv4.2/cv4.2.2/Conv": { 'ON': 'BPU', 'InputType': 'int16', 'OutputType': 'int16' }
  }

input_parameters:
  input_type_rt: 'nv12'                  # BPU 原生 NV12 输入
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451         # 1/255

calibration_parameters:
  cal_data_dir: '/data/calibration_data_gate240_stage1_rgb'  # prepare_calibration.py 生成的 .rgb
  cal_data_type: 'float32'
  calibration_type: 'default'

compiler_parameters:
  compile_mode: 'latency'
  optimize_level: 'O3'
