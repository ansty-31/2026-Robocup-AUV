# vision.yaml — 纯视觉参数（相机 / 图像链路 / 模型 / 仿真 / 任务目标）
# 注释只写"是什么 + 当前值"；**注意事项（⚠️）、实测证据、历史沿革全部在 `doc/注释历史.md`**。

camera:
  fallback_sim: true
  front:  # 前视：撞球/过门使用
    type: usb  # sim | usb
    device: 0  # usb: 0 或 /dev/videoN
    width: 1280
    height: 720
    fps: 30
    calibration: cfg/front_camera.yaml  # 去畸变标定 yaml
  down:  # 下视(IMX415 MIPI)：保留
    type: sim  # sim | mipi
    device: /dev/video1
    width: 640
    height: 360
    fps: 20
    calibration: null

stream:
  enable: false  # 默认关
  host: 192.168.137.2  # 水面 PC 的 IP
  port: 5000  # UDP 端口
  stream_fps: 30  # 推流帧率上限
  pkt: 8000  # UDP 切片大小

image:
  chain: D
  undistort: true  # true: cv2.remap 去畸变
  white_balance_bgr: [1.0, 1.05, 1.15]  # 白平衡通道增益
  clahe_clip: 0  # 关掉可省 ~8 ms/帧
  gamma: 0.85  # gamma LUT

color:
  line_red:  # 下视红色标示线
    rgb: {r_min: 150, g_max: 90, b_max: 90}  # 无 cv2 时的 RGB 近似
    hsv: {h1: [0, 12], h2: [168, 180], s_min: 90, v_min: 90}  # cv2 双区间
    min_area_ratio: 0.002

model:
  mode: hbm_runtime  # mock | hbm_runtime | onnx
  format: rdk_x5_bin  # RDK X5 模型必须是 X5 OE 工具链(hb_mapper makertbin)产出的 .bin
  path: models/yolo11n_detect_bayese_640x640_nv12.bin
  strict_x5_bin: true  # true: 拒绝 .hbm 后缀并提示正确编译链路
  input_size: 640  # 模型方形输入
  input_name: images  # hbm_runtime 输入名
  fast_nv12: true  # true: 用 cv2 快速 NV12(快~30x, 标准BT.601色度)
  score_threshold: 0.6  # ball/gate **共用**
  nms_threshold: 0.45
  labels: [blue_ball, gate, red_ball]  # 类别顺序必须与训练/导出一致
  task_models:
    gate: {path: models/gate_kpt_stage1_v3_bayese_640x640_nv12.bin,
           kind: keypoint, labels: [gate],
           kpt_order: [TL, TR, BR, BL]}  # 门 keypoint 权重(4角点)

mission:
  target_color: blue  # 任务目标球颜色：red | blue

sim:  # 虚拟相机
  noise: 8
  front: {}  # 前视虚拟：噪声底
  down:
    red_line: {enable: true, width: 30, dx_offset: 0.0}
  ball:  # mock 检测器出球序列
    appear_frame: 5
    ratio_start: 0.05
    ratio_step: 0.006
    hit_ratio: 0.85
    center_jitter: 0.03

debug:  # 运行监测
  show_video: true  # 弹窗显示带识别框的相机画面
  overlay_text: true  # 画面叠加 状态/任务信息
gate:  # 过门
  geometry: {frame_w: 0.70, frame_h: 0.50, bar_width: 0.05,
             sym_bars: true, body_center_offset: 0.0}
  det: {conf: 0.5}
  postproc: {edge_tol: 0.10, min_edges: 2, geom_check: true, lr_norm: true}
  select: {mode: near}
  keypoint: {conf_thr: 0.8, vis_thr: 0.5}
  kpt_mem: {enable: false, alpha: 0.4, beta: 0.1, valid_ms: 800,
            k_sigma: 3.0, r_min_px: 10.0, r_max_px: 80.0,
            sigma_init_px: 8.0, sigma_lambda: 0.15, sigma_floor_px: 0.5,
            w_min: 0.0, conf_floor: 0.05, recall_conf: 0.45, conf_decay: 0.35,
            max_missing_frames: 5, min_frames: 2}
  pnp: {reproj_px: 20.0, z_min: 0.2, z_max: 15.0, refine: true,
        max_z_jump_m: 0.8}
