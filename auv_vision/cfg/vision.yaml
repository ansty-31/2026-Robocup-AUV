# vision.yaml — 纯视觉参数（相机 / 图像链路 / 模型 / 仿真 / 任务目标）
# 注释只写"是什么 + 当前值"；**注意事项（⚠️）、实测证据、历史沿革全部在 `doc/注释历史.md`**。

camera:
  fallback_sim: true
  front:  # 前视(主视)：撞球/过门使用 —— 板端实测 USB 2.0 Camera = /dev/video2
    type: usb  # sim | usb
    device: /dev/video2  # usb: 0 或 /dev/videoN
    width: 1280
    height: 720
    fps: 30
    calibration: cfg/front_camera.yaml  # 去畸变标定 yaml
  down:  # 下视：板端实测 HBV HD CAMERA = /dev/video0（usb 1.1）
    type: usb  # sim | usb
    device: /dev/video0
    width: 1280
    height: 720
    fps: 20
    calibration: null

stream:
  enable: false  # 默认关
  host: 192.168.137.2  # 水面 PC 的 IP
  port: 5000  # UDP 端口
  stream_fps: 30  # 推流帧率上限
  pkt: 8000  # UDP 切片大小

image:
  undistort: true  # true: cv2.remap 去畸变
  white_balance_bgr: [1.0, 1.05, 1.15]  # 白平衡通道增益
  clahe_clip: 0  # 关掉可省 ~8 ms/帧
  gamma: 0.85  # gamma LUT

color:
  line_red:  # 下视红色标示线
    rgb: {r_min: 150, g_max: 90, b_max: 90}  # 无 cv2 时的 RGB 近似
    hsv: {h1: [0, 12], h2: [168, 180], s_min: 90, v_min: 90}  # cv2 双区间
    min_area_ratio: 0.002

model:
  mode: hbm_runtime  # mock | hbm_runtime | onnx
  format: rdk_x5_bin  # RDK X5 模型必须是 X5 OE 工具链(hb_mapper makertbin)产出的 .bin
  path: models/yolo11n_detect_bayese_640x640_nv12.bin
  strict_x5_bin: true  # true: 拒绝 .hbm 后缀并提示正确编译链路
  input_size: 640  # 模型方形输入
  input_name: images  # hbm_runtime 输入名
  fast_nv12: true  # true: 用 cv2 快速 NV12(快~30x, 标准BT.601色度)
  score_threshold: 0.6  # ball/gate **共用**
  nms_threshold: 0.45
  labels: [blue_ball, gate, red_ball]  # 类别顺序必须与训练/导出一致
  task_models:
    gate: {path: models/gate_kpt_stage1_v3_bayese_640x640_nv12.bin,
           kind: keypoint, labels: [gate],
           kpt_order: [TL, TR, BR, BL]}  # 门 keypoint 权重(4角点)

mission:
  target_color: blue  # 任务目标球颜色：red | blue

sim:  # 虚拟相机
  noise: 8
  front: {}  # 前视虚拟：噪声底
  down:
    red_line: {enable: true, width: 30, dx_offset: 0.0}
  ball:  # mock 检测器出球序列
    appear_frame: 5
    ratio_start: 0.05
    ratio_step: 0.006
    hit_ratio: 0.85
    center_jitter: 0.03

debug:  # 运行监测
  show_video: true  # 弹窗显示带识别框的相机画面
  overlay_text: true  # 画面叠加 状态/任务信息
gate:  # 过门
  geometry: {frame_w: 0.70, frame_h: 0.50, bar_width: 0.05,
             sym_bars: true, body_center_offset: 0.0}
  det: {conf: 0.5}
  postproc: {edge_tol: 0.10, min_edges: 2, geom_check: true, lr_norm: true}
  select: {mode: near}
  down: {enable: true}  # 下视辅助过门：coarse/width 门口识别红色横向门框 ⇒ 进 creep_through（下视=USB 720p，HSV 已实测确认）
  keypoint: {conf_thr: 0.8, vis_thr: 0.5}
  kpt_mem: {enable: false, alpha: 0.4, beta: 0.1, valid_ms: 800,
            k_sigma: 3.0, r_min_px: 10.0, r_max_px: 80.0,
            sigma_init_px: 8.0, sigma_lambda: 0.15, sigma_floor_px: 0.5,
            w_min: 0.0, conf_floor: 0.05, recall_conf: 0.45, conf_decay: 0.35,
            max_missing_frames: 5, min_frames: 2}
  # ★★ 2026-10-07 用户定：**远端 z 压缩 = 压阈值**（不是缩放实测值）：
  #   `z_max` 15.0 → **3.0**（"cfg 里任何大于 3.0m 的距离参数都压回来"）。
  #   它是**唯一有代码读**的远端距离键（`_z_est` 的 z_bounds、width 档的 clip、gate_pose 的 z_bounds）。
  #   效果（实测 width 档的 4 个台阶）：3.123 / 3.383 / 3.691 / 4.060 全部越界，
  #   叠加 `comm.gate.z.dist_max_m=2.5` ⇒ 远端彻底不可信；full 档最大 1.958 不受影响。
  pnp: {reproj_px: 20.0, z_min: 0.2, z_max: 3.0, refine: true,
        max_z_jump_m: 0.8}

grab:  # 任务三 夹取小球（**纯 CV 感知，不走 BPU**；实测见 grab/README.md）
  detect: {mode: cv}  # cv | mock（mock = 不注册后端，交回 legacy/mock）
  kind: red_ball     # 返回的 Det.kind（与 model.labels 对齐）
  cv:  # 红球检测阈值 = 700 帧扫参 + 板端复核后的工作点；删掉任一键都用代码同值默认
    dom_min: 30      # R - max(G,B) 下限（绝对红占优）
    rel_min: 0.30    # (R-max(G,B))/(R+max(G,B)+1) 下限（救水下衰减的暗球）
    s_min: 40
    v_min: 60
    close_k: 9       # 填高光孔的闭运算核
    open_k: 5
    min_area: 30
    circ_min: 0.30
    cov_min: 0.35
    min_arc_deg: 150.0
    r_min: 25.0      # 半径下限：<30px 的检出实测是池底图案红点/瓦缝红光
  # ★ 目标色集合（用户 2026-10-06 定）：**比赛用粉球与黄球**；现在先用红球测逻辑与运动。
  #   "红球外的可以都毙了" ⇒ 现在 `active: [red]`，其余色**根本不参与检测**（红掩膜天然只认红）。
  #   红球阈值 = 上面的 `grab.cv`（700 帧真图已标定，单一来源，别搬）。
  #   其余颜色必须 `enable: true` + `calibrated: true` + 关键键写全，才会被 `Params.from_target`
  #   认下来（否则返回 None = "这个颜色还不存在"）—— **绝不用红球的默认值冒充**。
  #   ⚠️ 黄球不能照抄红那套判据：`dom = R − max(G,B)` 对黄色恒 ≈0 ⇒ 判据形式本身要重新定
  #      （候选：① 色相带 + s/v 门限；② 换成"反色通道"的 min(R,G)−B 形式）。**实测后再选。**
  #   量法（待做）：录真图 → 量目标区内的 dom/rel/HSV 分布 → 填分位值（如 dom 的 p10）。
  targets:
    active: [red]            # 生效顺序（检测与验色都用它）；比赛前改成 [pink, yellow]
    pink:   {enable: false, calibrated: false, dom_min: null, rel_min: null, use_rel: null,
             use_hue: null, h_lo: null, h_hi: null, h_hi2: null, s_min: null, v_min: null}
    yellow: {enable: false, calibrated: false, dom_min: null, rel_min: null, use_rel: null,
             use_hue: null, h_lo: null, h_hi: null, h_hi2: null, s_min: null, v_min: null}
    #   ↑ 全 null = **还没量**（"准备阈值"= 槽位 + 闸 + 量法；数值等素材）
  track:  # 流式 ROI 跟踪（关掉=每帧全图，板端 15 FPS；打开=跟踪稳态 ~39 FPS）
    enable: true
    margin: 64       # ROI 在球外每边多留的像素（实测最大帧间位移 ≈40px）
    proc_side: 256   # 0 = 关尺度归一化；>0 = ROI 缩到该边长再检测（成本与球大小无关）
    max_lost: 3      # 连续丢几帧后回全图搜索
