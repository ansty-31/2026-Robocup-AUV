# =============================================================
# comm.yaml — 通信与运动决策参数（串口帧 / DOF 映射 / 心跳急停 /
#             运动预设与速度阈值 / PID / 任务使能与时序 / 边界条件）
# =============================================================

serial:
  device: /dev/ttyS1
  baud: 9600

frame:                     # 11B：0xA5 + 7轴 + 3键（模拟遥控，详见 docs/CUP_AUV）
  header: 165              # 0xA5
  axis_count: 7
  btn_count: 3
  axis_mid: 128
  axis_range: 127
  aux_axis: {4: 165, 5: 1, 6: 1}   # axis4=滚轮静止/中值, axis5/6=tri 中位
  btn_values: [0, 0, 0]    # 当前下位机固件未使用

dof_map:                   # DOF→轴字节真值表（下位机 RC_Translate）
  surge: {axis: 1, sign: 1}   # 前后 ← LY
  sway:  {axis: 3, sign: 1}   # 左右平移 ← RY
  heave: {axis: 2, sign: 1}   # 升降 ← RX
  yaw:   {axis: 0, sign: 1}   # 旋转 ← LX

heartbeat:
  interval_ms: 50          # ≥20Hz（下位机当前无帧超时停车 → 必须持续心跳）
estop:
  repeat_ms: 30            # 急停连发中性帧间隔
ramp:
  speed_per_s: 220.0       # 轴字节平滑速率（0=关闭）
  dof_per_s: 1.0           # DOF 级线性斜坡：归一化速度/秒（0=关闭）
                           #   模拟人手推杆：速度连续变化到目标，而不是直接激增

motion:                    # 动作/速度预设（归一化 DOF：surge,sway,heave,yaw）
  search_yaw: 0.3          # 无目标时原地旋转搜索（30% 转速，右转）
  loss_inertia_surge: 0.25 # 目标短时丢失时的低速惯性
  presets:
    stop:         [0.0, 0.0, 0.0, 0.0]
    forward_fast: [1.0, 0.0, 0.0, 0.0]
    forward_slow: [0.35, 0.0, 0.0, 0.0]
    backward:     [-0.5, 0.0, 0.0, 0.0]
    left:         [0.0, -1.0, 0.0, 0.0]
    right:        [0.0, 1.0, 0.0, 0.0]
    up:           [0.0, 0.0, 1.0, 0.0]
    down:         [0.0, 0.0, -1.0, 0.0]
    turn_left:    [0.0, 0.0, 0.0, -0.4]
    turn_right:   [0.0, 0.0, 0.0, 0.4]
    search:       [0.0, 0.0, 0.0, 0.3]    # 右转；与 motion.search_yaw 一致（任务一走脉冲，不依赖本 preset）

tasks:
  enabled: [ball]           # 任务一；任务二=记忆返回(task1-2/*.sh)；gate 需后端/mock
  fault_action: skip       # 模型缺失等：skip | exit
  idle_ms: 1000
  done_hold_ms: 500

ball:                      # 任务一 撞球：运动链 SEARCH→CENTER→APPROACH→DASH→STOP
  # ---- 视觉量 → 运动决策 ----
  ema_alpha: 0.3            # 面积占比 EMA 平滑(判据与日志都用它, 抗单帧抖动)
  lost_grace_frames: 15     # 丢目标后的"短时保持/惯性"帧数
  r_slow: 0.12              # 面积分级: >=该值且增长缓慢 → 用 slow; 其余用 fast
  growth_eps: 0.002         # 面积增长阈值: 增长快 → 用 fast(说明在快速接近)
  surge_fast: 0.35          # 分级最高速(同时就是冲刺速度)
  surge_slow: 0.15          # 分级慢速(接近段减速)
  align_x: true             # 居中: x → yaw(旋转; 撞球不做左右平移)
  align_y: true             # 居中: y → heave
  timeout_ms: 20000         # 总时限 20s(DASH/STOP 期间不打断, 保证命中与停稳)
  # ---- SEARCH: 脉冲旋转 + 周期性前进探测（沿用原方案）----
  search_spin_s: 0.5        # 旋转时长(转0.5s)
  search_pause_s: 1.5       # 旋转后停顿(停1.5s, 间隙检测更稳)
  search_advance_after_s: 4 # 连续无目标这么久 → 慢速前进探测一次
  search_advance_dur_s: 0.5 # 前进探测时长(阶段窗口, 不按总时限等比缩)
  search_advance_surge: 0.25 # 前进探测速度
  # ---- CENTER: yaw + heave, 不前进不横移 ----
  center_eps: 0.25          # 水平+竖直居中判据(归一化偏差)
  center_confirm_frames: 3  # 连续居中帧数达标 → APPROACH
  edge_yaw_kp: 0.3          # 居中转向 P 增益
  edge_yaw_kd: 0.0          # 居中转向 D 增益(阻尼: 防转过头)
  edge_yaw_max: 0.15        # 居中转向限幅(0.1~0.25)
  pid: {kp: 1.0, ki: 0.0, kd: 0.15, out_max: 0.7, deadzone: 0.04}   # 居中 heave(垂直)
  # ---- APPROACH: 仅 sway 修水平(yaw=0/heave=0), 参数移植自独立实验 ----
  approach_pid: {kp: 12.0, ki: 0.01, kd: 0.05, out_max: 0.45, deadzone: 0.05}
  lost_inertia_surge: 0.25  # 接近中短时丢失的惯性前进速度(不在居中段生效)
  # ---- DASH/STOP: 面积达标 → 冲刺 → 稳定停 ----
  dash_ratio: 0.25          # 面积(EMA)达标阈值
  dash_confirm_frames: 2    # 连续达标帧数(防单帧误检直接结束任务)
  dash_dur_s: 2.0           # 冲刺时长(不检测是否撞到)
  stop_hold_s: 1.0          # 命中后全 0 保持时长(稳定停住)
  engage_hold_s: 0.8        # 丢目标后原地 hold 窗口, 过完回 SEARCH

handover:                  # 返回出发区策略B：视觉居中 → 交下位机接管握手 → 收权 → 后退
  header: 170              # 0xAA 交接帧头：以该帧头发帧表示“暂时交给下位机接管”
  resume_flag: ""          # 下位机回传的“特殊标志”(十六进制串, 如 "aa55ff")；空=不判定内容
  resume_timeout_s: 0      # 0=一直等下位机标志；>0 超时则继续(仅联调用)
  standby_neutral: true    # 待命期间持续以 header 发中性帧心跳(≥20Hz)
  rev1_s: 1                # 撞球结束后先后退时长(秒)
  rev2_s: 3                # 收权居中后直接后退时长(秒)
  rev_speed: -0.35         # 后退速度(归一化; 负=后退)
  yaw_kp: 0.8              # 原地居中: yaw 比例增益
  yaw_max: 0.5             # yaw 限幅
  yaw_sign: 1              # yaw 方向(装反改 -1)
  sway_kp: 0.9             # 收权后: 仅左右平移居中的比例增益
  sway_max: 0.6            # sway 限幅
  sway_sign: -1            # sway 方向(与 ball 居中一致; 装反改 1)
  y_align: false           # 原地居中是否也用 heave 修垂直(默认仅水平)
  center_x_eps: 0.10       # 水平居中阈值(归一化偏差)
  center_confirm_frames: 3 # 连续居中帧数达标
  center_timeout_s: 20     # 每段居中阶段超时(秒)

back:                      # 返回出发区（下视红线相位机）
  timeout_ms: 300000
  align_deadzone: 0.10
  align_min_frames: 5
  travel_correct_th: 0.22
  line_lost_finish_frames: 25

gate:                      # 过门（§5.3 相位机：SEARCH→RANGE_ALIGN→APPROACH→THROUGH）
  timeout_ms: 180000
  pass_target: 1            # 完成计数目标：单门 1；高低两门可设 2
  pid: {kp: 1.0, ki: 0.0, kd: 0.15, out_max: 0.6, deadzone: 0.04}
       # 横向 PID：对齐撞球那套(kp1.0/kd0.15/死区0.04)——慢一点、带阻尼、不易转过头
  align: {xy_m: 0.05, confirm_frames: 6}   # 对准判据：|t_x|,|t_y|(m) 与确认帧数
       # 横向微调只在冲刺前/对准阶段做；穿门(THROUGH)阶段直行不再修正
  z: {align_max: 4.0, fast_max: 3.0, slow_max: 1.3, cross: 0.7,
      cross_confirm_frames: 2,   # 连续 z≤cross 帧数才判过门(防单帧 PnP 错解冲出去)
      near_lost_m: 1.0}          # 进近中已到该近距后整门丢失 → 判过门(门占满视野)
  surge: {fast: 0.35, slow: 0.15, creep: 0.12, lost_backward: 0.12, reacquire: 0.25, through: 0.5}
         # fast/slow = 进近两档(远 z>slow_max 用 fast / 近用 slow)；
         # creep=coarse/width 慢蠕进；lost_backward=远处短暂丢失的轻微后退(代码取负)；
         # reacquire=后退重取；through=穿门冲刺
  coarse: {far_ratio: 0.18, near_ratio: 0.55, align_x: 0.05, align_y: 0.10}
         # far/near_ratio=门框宽/屏宽 远近判定；align_x/y=整框对中阈值(归一化)
  hold: {max_frames: 20}      # HOLD 无进展帧数 → REACQUIRE(触发门槛保持原值)
  reacquire: {max_ms: 800,        # 单次后退上限(原 2000 → "明显后退"的主因)
              max_times: 2,       # 连续这么多次仍拿不到角点 → 放弃后退, 改原地 HOLD
              stop_ratio: 0.75,   # 闭环后退: 框占比退到进入时的 75% 就停
              reset_after_ms: 3000}
              # reset_after_ms: 距上次后退超过这么久 → 重新允许 max_times 次后退
  through: {confirm_frames: 8} # 过 Z_pass 后目标消失确认帧数 → 判过门
  search: {spin_s: 2.0, pause_s: 1.0, yaw: 0.35}
  pose_hold_frames: 10        # 帧间防抖：丢姿态时的保持帧数

  # ---- 质量分 Q（v1.4）：一帧证据质量，去**两个**地方，都不参与过门判定 ----
  #   ① 先验(prior)    ：原始角点 conf × 帧新鲜度 → 逐点权重 w_prior，
  #                      连同 q_mem(历史位姿证据) 的帧级增益进 kpt_memory 融合权重
  #   ② 后验(posterior)：重投影 RMS + 位姿投影框 IoU（含线索↔位姿互检）
  #                      → 运动谨慎度 c → 速度缩放 / 死区缩放
  #   confirm_max_scale=1.0 表示**不改确认时长**，只改"给多少权重 / 开多快"
  quality:
    w_kpt: 1.0               # 分量权重：角点可见数+平均置信度
    w_pnp: 1.0               #           重投影 RMS
    w_box: 0.8               #           位姿投影框 vs 检测框 IoU（两链互检那条）
    w_time: 0.5              #           帧新鲜度
    rms_ref_px: 5.0          # RMS 参考尺度（该值处 q_pnp≈0.5）
    q_no_pose: 0.25          # 无位姿时的 q_pnp
    box_iou_floor: 0.4       # IoU ≤ 它 → q_box=0；≥0.9 → 1
    q_lo: 0.35               # Q≤q_lo → 谨慎度 0（最谨慎）；Q≥q_hi → 1（正常）
    q_hi: 0.75
    speed_min_scale: 0.4     # 最谨慎时速度保留比例（下限，不会停死）
    confirm_max_scale: 1.0   # 1.0 = 质量分**不影响**确认时长
    deadzone_max_scale: 1.6  # 最谨慎时对准死区/阈值最多放大到几倍
    prior_conf_pow: 1.0      # 先验里原始置信度的幂（<1 更宽容）
    q_time_floor: 0.2        # 帧新鲜度下限（过期帧照常估计，只是权重低）
    mem_lambda: 0.3          # q_mem(历史位姿证据) EMA 速率 → 喂下一帧先验

  # ---- 恢复线索 + 线索↔位姿互相自检（v1.3；方向符号需水池实测）----
  cues:
    enable: true
    record_only: false       # true=只记录不驱动（下水前先这样核对方向符号）
    speed: 0.15              # 线索动作统一低速（仍会乘质量分速度缩放）
    too_close_height_ratio: 0.9
    boundary_margin_ratio: 0.02
    turn_right_on_left_column: true     # 仅 TL,BL 可见 → 右转
    turn_left_on_right_column: true     # 仅 TR,BR 可见 → 左转
    descend_on_top_edge: true           # 仅 TL,TR 可见 → 下降
    ascend_on_bottom_edge: true         # 仅 BR,BL 可见 → 上升
    backward_on_too_close: true         # 框上下贴边 → 后退
    backward_agree_z_m: 1.5  # 线索判"太近"但位姿 z 仍 > 它 → 冲突（质量分打折）
    agree_bonus: 0.15        # 线索与位姿一致 → 质量分加成（封顶 1.0）
    conflict_penalty: 0.5    # 冲突 → 质量分打折（只降权，不驱动）
    cue_after_frames: 15     # 位姿连续不可用多少帧后线索才接管
    cue_confirm_s: 0.10      # 线索动作确认：时长（秒）
    cue_confirm_frames: 3    #               帧数（双条件，common/streak.py）

    # ---- 主导权三档位：线索链 vs 位姿链（v1.5）----
    #   auto  依据质量自动分配（**默认**）：位姿 Q 高 → 位姿主导；Q 低 → 线索份额上升
    #   pose  位姿主导：位姿在位时线索一律不驱动，只在位姿不可用时兜底（等于 v1.4 行为）
    #   cue   线索主导：相位允许且有明确线索动作 → 整帧听线索（不看 Q）
    #   （旧名仍接受：pose_first→pose，blend→auto，cue_first→cue）
    # 三档都会：① 位姿不可用时兜底接管（≥ cue_after_frames 帧）
    #          ② 过动作确认（cue_confirm_*）③ THROUGH 相位永不介入
    mode: auto
    allow_approach: false    # 线索是否允许在 APPROACH 生效（想更主导就 true）
    cue_pose_share: 0.0      # 仅 cue 档：给位姿保留的份额（0=完全接管，≤0.5）
    speed_lead: 0.30         # 主导档（auto/cue）线索速度（pose 档仍用上面的 speed）
    speed_uses_caution: false # 仅主导档：线索速度是否再乘谨慎度（默认不乘）
    lead_q: 0.35             # auto 档：位姿后验 Q 低于它 → 线索权重开始 > 0
    lead_full_q: 0.20        # auto 档：位姿 Q 低于它 → 线索权重 = 1（完全主导）
    conflict_w: 1.0          # auto/cue 档：冲突时线索的权重下限（0=冲突仍听位姿）
    lead_min_w: 0.25         # 权重小于它就不掺和（防两链各出一半力来回抖）

  # ---- 帧守卫（v1.3，共用件 common/frame_stamp.py）----
  # 唯一帧/单调时间/帧龄/采集断点；过期帧**仍用于估计**但不计入确认（两分法）
  stamp: {max_age_s: 0.9, max_gap_s: 0.35, adaptive_gap: true, future_tol_s: 0.005}

debug:                     # 通信调试
  tx_frame_hex: true        # 终端打印每次发出的 11B 运动帧（真串口下）
  tx_frame_log_ms: 0     # 打印节流（毫秒，200=5Hz）
