# comm.yaml — 通信 / 底层运动 / 任务参数（**参数唯一来源**）
# 注释只写"是什么 + 当前值"；**注意事项（⚠️）、实测证据、历史沿革全部在 `doc/注释历史.md`**。
# 约定：ball/gate 共用参数只写 `motion` 段，任务段只在"确实要单独一套"时写覆盖键。

serial:
  device: /dev/ttyS1
  baud: 9600

frame:  # 11B 定长帧
  header: 165  # 0xA5
  axis_count: 7
  axis_mid: 128
  axis_range: 127
  aux_axis: {4: 165, 5: 1, 6: 0}  # axis4=滚轮静止/中值, axis5=tri 中位, axis6(byte[7])=0 见下
  # ★ index 6 = 整帧 byte[7] = "指定角度轴"：0=不发起新任务, 1=yaw, 2=pitch, 3=roll。
  #   普通/中性帧按协议 §6-2 设 **0**（下位机已烧录该协议；byte[7]=0 不关闭姿态 PID、不恢复姿态、
  #   不取消已有任务）。**执行帧由 `frame.turn_axis` 显式覆盖该字节**，与这个默认值解耦 ⇒
  #   改这里的值不会影响任何转向（`build_turn_frame` 自己写 byte[7]）。（详细见 doc/注释历史.md）
  turn_axis: {yaw: 1, pitch: 2, roll: 3}  # 轴名→byte[7]；执行帧显式写入（协议 §2/§6-1），缺键用代码同值
  btn_values: [0, 0, 0]  # byte8/9用于相对转角/取消；byte10为旋转编号，普通帧均为0

dof_map:  # DOF→轴字节真值表
  surge: {axis: 1, sign: 1}  # 前后←LY、左右平移←RY、升降←RX、旋转←LX
  sway:  {axis: 3, sign: 1}
  heave: {axis: 2, sign: 1}
  yaw:   {axis: 0, sign: 1}

heartbeat:
  interval_ms: 50  # 心跳间隔(ms)，≥20Hz
estop:
  repeat_ms: 30  # 急停连发中性帧间隔(ms)
watchdog:  # ★ **轴看门狗**（独立线程）：手动轴看「同向饱和」，pitch/roll 看「姿态超限」
  enable: true  # 独立线程
  axes: [yaw, pitch, roll]  # ★**盯哪些轴**：yaw=同向饱和；pitch/roll=不走手动轴字节，看 IMU 姿态
  tilt_hold_s: 0.5  # 姿态超限要**连续**这么久才停船（防单帧抖动误停）
  #   姿态限值复用 comm.motion.axis.max_tilt_deg（单一来源，默认 50°）
  #   ⚠️ 判据是**绝对** IMU 角：若 IMU 安装有偏置（上电静止读数就 >50°）会立刻停船 ——
  #     那本身就是要先解决的问题（看门狗日志会把上电基准打出来，便于判断是不是偏置）  max_same_dir_s: 10.0  # 同一轴、**同一方向**连续发轴超过这么多秒 ⇒ estop 硬停 + 强制退出(9)
  min_off_b: 13  # 偏离中位超过这么多**字节**才算"在发轴"
  poll_ms: 50  # 巡检周期(ms)
ramp:
  speed_per_s: 220.0  # 轴字节平滑速率(字节/秒)：速度连续变化到目标，不是直接激增

telemetry:  # 下位机上行姿态/深度的**符号归一**
  yaw_sign: 1.0  # 遥测 yaw × 它
depth_guard:  # 限深保护：只压上浮，不动前进/转向
  enable: true  # 当前深度 ≤ min_depth_m → 本帧 heave 清零并当帧回中，机身顶不出水面
  min_depth_m: 0.50  # 现场定死值（**2026-10-06 用户从 0.55 下调到 0.50**）
  #   ⚠️ 改这个数必须**同时**改：`base/hw/uart.py::_D_MIN_DEPTH_M`（代码兜底，删键时用）、
  #      `tests/platform/test_base.py` 的不变用例、`tests/_bite_probe.py` 的说明。
  #   ⚠️ 露出水面 = 比赛立即停止：下调即放宽安全边界（抬头 30° 时抬高 ≈ (机长/2)·sin30°），
  #      必须现场量机头（含相机壳）离水面余量后再定。
  stale_ms: 500  # 遥测超过这么久(ms)没更新 → 视为没有深度
  stale_action: pass  # 无新鲜深度时：pass=放行(台架/仿真友好) | block_up=连盲上浮也不许
  snap: true  # 触发时 heave 轴当帧直接回中
  log_ms: 1000  # 触发告警打印节流(ms

dof_comp:  # **底层共用**：单独调"下潜"这一路动力
  enable: true  # 只对 heave<0
  dive_scale: 2.0  # 下潜指令 × 它再夹到 [-1,0]

motion:  # **ball / gate 共用的底层运动参数**
  # ★★ 2026-10-07 用户定（修"sway 一直顶在 ±0.55"，依据 log/rungate_20261006_postsway
  #   有测量 236 帧）：`kp 8.0 → 1.0`、`kd 0.05 → 0.02`、**新增 `bias: 0.138`（执行器死区补偿）**。
  #   实测病根：比例区只有 out_max/kp = 0.55/8 = **0.069** 宽（占满幅 1.9%），而误差 |dx| 中位 0.090
  #   ⇒ **63% 的帧只要算 sway 就必然饱和**（full/coarse 档 78%），实测饱和占 63%、符号每 7.6 帧翻一次
  #   ⇒ 那是极限环，不是比例控制（对照 heave kp=1.0 实测 0% 饱和）。
  #   ⚠️ **不能只降增益**：推进器 |DOF|<0.138 时推力为 0，kp=1.5 时输出中位只有 0.15（几乎没推力）
  #   ⇒ 必须同时把输出抬到死区之上（`bias`）。
  #   离线复算同一批误差：饱和 64%→**1%**、落在比例区 10%→**72%**、输出中位 0.55→**0.24**。
  #   ⚠️ 这个节点是 **ball 与 gate 共用**（"一处调、两个任务同时生效"，见 tests 的单一来源用例）
  #      ⇒ 撞球的横向居中回路一并受益/一并改变；回退只需把 kp 改回 8.0、删掉 bias。
  pid_sway:  {kp: 10.0, ki: 0.0, kd: 0.05, out_max: 0.55, deadzone: 0.05, bias: 0.138}
  pid_heave: {kp: 1.0, ki: 0.0,  kd: 0.0, out_max: 1.0,  deadzone: 0.04}
  surge_fast: 0.30  # 快档：ball 分级最高速/冲刺、gate 远距进近
  surge_slow: 0.15  # 慢档：ball 接近段减速、gate 近距进近
  loss_inertia_surge: 0.25  # 目标短时丢失时的低速惯性
  search_yaw: 0.3  # 无目标时原地旋转搜索
  # ★ 公共搜索扫描（2026-10-04 用户定）：球 / 门 / 未来夹球共用。
#   （细节与实测见 doc/注释历史.md）
  search_scan:
    span_deg: 40.0        # 单侧幅度；总扫幅 = 2×span_deg（默认 120°，可配）
    pause_ms: 400.0       # 每段到位后停顿（用户定；停的间隙检测更稳）
    tol_deg: 6.0          # 段到位容差
    norm_deg: 15.0        # 误差归一化分母
    seg_timeout_ms: 8000.0
    runaway_slack_deg: 30.0   # 段预算余量（防极性反了转圈）
    abs_slack_deg: 15.0       # 绝对预算余量：psi 离入场朝向不许超 span+tol+它
    duty: 1.0              # 慢速占空比（1.0=不降速；<1 时周期性发 0，比死区允许的更慢）
    duty_window_ms: 200.0  # 占空比窗口
    step_deg: 0.0          # ★ 分段逼近：目标按这个步长一格一格走（0=一步到位）
    step_pause_ms: 0.0     # 每格到位后停顿（0=连续爬）
    pid: {kp: 0.2, ki: 0.0, kd: 0.0, out_max: 0.15, deadzone: 0.4}   # kd 必须 0（10Hz 下 D 项易自激）；out_max 0.15 = 降速下限（当年警告的那条线）

  # ★ 横倾放球/倒球 = **跨任务共用**（任务三倒错球、任务四放球）。体例同 search_scan：
  #   共用默认写这里；任务段只在"确实要单独一套"时写覆盖键（`comm.grab.drop` / `comm.place.drop`）。
  drop:
    depth_floor_m: 1.0     # 横倾会让一侧抬高 ⇒ 序列期间收紧任务级限深下限（只抬不降）
    restore_floor: true    # 结束恢复**运行前的值**（不是 0：任务三自己已抬到 1.0m）
    #   步骤表语法（`steps` 是一串 dict；删掉 steps 用代码同值兜底）：
    #     {"name": 名字, "s": 秒, surge/sway/heave/yaw: ±1} → 定时推力
    #     {"name": 名字, "tilt": true}  → 横倾到 `comm.<任务段>.roll.dump_deg`（并记下横倾前的 roll）
    #     {"name": 名字, "level": true} → 回正（相对角 = wrap180(横倾前 roll − 当前 roll)，按遥测算）
    #   可单独跑：`python3 common/motion/drop.py --what dump|release [--prefix grab|place]`
    dump:                  # 任务三用：倒掉错球（用户口径：右移2s → 横倾倒出 → 左移2s → 后退2s）
      steps: [{name: 右移, s: 2.0, sway: 0.30},
              {name: 横倾倒出, tilt: true},
              {name: 保持横倾, s: 1.0},
              {name: 回正, level: true},
              {name: 左移回位, s: 2.0, sway: -0.30},
              {name: 后退, s: 2.0, surge: -0.30},
              {name: 停稳, s: 1.0}]      # 占位·未标定（平移/后退幅值都要现场标）
    release:               # 任务四用：到点放球（用户定：横倾 30° → 断动力 3s → 结束，不回正不后退）
      steps: [{name: 横倾放球, tilt: true},
              {name: 断动力停住, s: 3.0}]
  # ★ 左右平移扫视（**任务三/四的 search**；形状照 gate 那套 `_search_sweep`）。
  #   为什么不用 search_scan：抬头时转 yaw 会让目标绕圈跑，平移只让它横移；且不依赖 yaw 遥测。
  #   ⚠️ 开环、无横向位置反馈 ⇒ 一趟来回**可能有净漂移**（未验证，现场要实测）。
  search_sweep:
    sweep_s: 2.0        # 首轮单程时长(s)；每轮翻倍
    sweep_max_s: 32.0   # 单程时长上限(s)
    pause_s: 1.0        # 段间停顿(s)（停着检测更稳）
    sway: 0.35          # 平移幅值（用户 2026-10-07：0.20「几乎没什么动力」⇒ 0.35；死区 0.138）
    duty: 0.5           # ★ 占空比(<1)：本方向**推一小段、停一下**，不一次到位（幅值不动⇒不掉死区）
    duty_window_ms: 400 # 占空比窗口(ms)
    max_ms: 0.0         # 扫视总时长上限(ms)；0 = 不限（交给任务总时限兜）

  # ★ 指定角度轴的安全限幅（用户 2026-10-06 定）：pitch/roll **不准超过 ±50°**（yaw 不受限）
  #   指令侧：common/motion/turn_deg.TurnCore 夹紧；姿态侧：AxisMove 超限撤指令 + 停手；
  #   最外一层：看门狗（comm.watchdog）按**实测姿态**停船。**只有一个数**，三处都读它。
  axis:
    max_tilt_deg: 50.0

  presets:  # 手动模式/急停用的 DOF 预设（**只留生产真正用得到的**：main.py 收口发 stop）
    stop:         [0.0, 0.0, 0.0, 0.0]

tasks:
  enabled: [ball]  # 任务一
  fault_action: skip  # 模型缺失等：skip | exit
  idle_ms: 1000
  done_hold_ms: 500

grab:  # 任务三 夹取小球（决策层 2026-10-06 起建；**感知全程用下视相机**）
# ⚠️ 标「占位·未标定」的值上水前必须现场实测（标定顺序与判据见 doc/注释历史.md）。
# ⚠️ 未标定前**不要**把 grab 放进 tasks.enabled：calibrated 是安全闸，false ⇒ 本任务不 ready ⇒ 装配层跳过它。
  calibrated: true      # ★ 安全闸：false ⇒ 跳过本任务（不占状态机、不发任何指令）
  timeout_ms: 180000      # 总时限（用户 2026-10-06 定）；撞球 30s、过门 50s
  # ★ **夹取任务自己的一套 sway**（用户 2026-10-07：「夹取的 sway 单独设置一个，小一点的」）：
  #   CENTER / APPROACH / ALIGN 三个平移相位的横向都用它，不和 gate/ball 那套共用。
  #   ⚠️ 幅值别低于 ~0.25：执行器死区 0.138（用户实测 sweep 0.20「几乎没什么动力」）；
  #      `bias` = 死区补偿（把输出抬到死区之上），别删。
  pid_sway: {kp: 3.0, ki: 0.0, kd: 0.05, out_max: 0.24, deadzone: 0.05, bias: 0.138}
  #   ★ 2026-10-07 再降一档（用户「速度还是太快了」）：kp 6→3（近距离更柔和）、out_max 0.30→0.24。
  #   ⚠️ out_max **别低于 ~0.20**：执行器死区 0.138，再低就推不动 ⇒ 想更慢请用下面的 duty 脉冲。
  # ★ **平移脉冲闸门**（同 sweep 那招「推一小段停一下」；幅值不动 ⇒ 不掉死区）：
  #   作用域 = CENTER/APPROACH/ALIGN 的 sway+surge（heave 归定深、不受影响）。
  # ★ **平移脉冲闸门**（幅值不动、用占空比降平均速度；幅值低于执行器死区 0.138 就完全不动）：
  #   `duty` = 横向(sway)；前进(surge) 按相位另给（用户 2026-10-07：「前进的动力再小还是太大」
  #   「小球很小，**居中时前进速度要很小**（该机前进动力较大）」）：
  #   center 最稀 / align 次之 / approach **不额外削**（否则永远接近不了）
  # ★ **平移脉冲闸门**：幅值不动，用**占空比 + 窗口**降平均速度（用户 2026-10-07：「越慢越好」）。
  #   横向(sway) 用 `duty`/`duty_window_ms`；前进(surge) 另有 `duty_surge*` 与 `duty_window_ms_surge`。
  #   ⚠️ **别拿执行器死区 0.138 给前进当"够慢"的下限**（0.138 出自 gate 那条线：
  #      common/motion/PID.py / search_scan.py / doc/记录/2026-10-07-gate-阈值与运动重设.md）：
  #      刚出死区的幅值对**前进**已经太猛（该机前进推力大）⇒ 前进靠**短脉冲**慢下来。
  #   ⚠️ 别把 duty 压到 ~0.1 以下 / 窗口缩到几十 ms：推进器来不及起转 ⇒ 变成"完全不走"。
  #   center 最稀、align 次之、approach 减半（还要能接近；不行就往上调它）。
  duty: {enable: true, duty: 0.35, duty_window_ms: 250, duty_window_ms_surge: 300,
         duty_surge: 0.2, duty_surge_center: 0.15, duty_surge_align: 0.2, duty_surge_approach: 0.5}
  depth_floor_m: 0.50    # ★ 翘头时的**安全下限**（工作区间 0.5~0.6，见 depth_hold）
  #   全局限深 2026-10-06 已由用户下调为 **0.50** ⇒ 本值与它同值，浅端不再被卡在 0.55，
  #   0.5~0.6 的整段都可用了（真正的工作点由 `depth_hold.target_m`=0.55 决定）。
  #   ⚠️ 但注意方向冲突：你最早的口令是『翘头 30° **保证不出水面** ⇒ 下限增大』，
  #      现在为了看得见要**变浅** ⇒ 机头离水面的余量变小了。抬头 30° 机头抬高 ≈ (机长/2)·sin30°，
  #      **下水前必须现场量**：抬头到位后目视/卷尺量机头（含相机壳）离水面还有多少，记录在案。
  #      要回退：把这个数改回 0.8（一行），或临时 AUV_CFG_DIR 指向一份更保守的 cfg。
  ensure_depth: true     # 抬头前先下潜到该下限；关掉 = 不再"保证不出水面"（默认必须是开）
  ensure_depth_s: 8.0    # 下潜到位的时间上限；超时 → 放弃抬头（不硬顶）
  descend_heave: -0.40   # 下潜幅值（占位·未标定；下层还有 dof_comp.dive_scale 会再放大）
  depth_tol_m: 0.05      # 到位容差(m)：深度遥测有量化误差，别贴死
  # ★ 定深（用户 2026-10-06：翘头时深度控制在 **0.5~0.6**，不准太深也不准太浅）
  #   作用范围：只在抬头**工作段**（SEARCH/CENTER/APPROACH）。DIP/RISE 故意变深度（下压/上升）⇒ 不插手；
  #   ALIGN 用 surge(dy)+sway(dx) 本就不动 heave；EXIT 只放平俯仰。
  #   浅端实际生效值 = `max(band_lo, 全局 min_depth_m)`。全局 2026-10-06 已下调为 0.50 ⇒
  #   生效下沿 = 0.50，**整段 0.5~0.6 都可用**；若哪天把全局抬回去（>0.50），生效下沿会跟着抬，
  #   DepthHold 会在启动时把这件事打印一次（不静默）。
  depth_hold:
    enable: true
    target_m: 1.3      # 目标（区间中点）
    band_lo_m: 1.20      # 期望区间下沿（**实际生效 = max(它, 全局 min_depth_m)**）
    band_hi_m: 1.40      # 区间上沿：超过就算「太深」→ 上浮
    kp: 1.0              # 比例（深度误差 m → heave）；无积分 ⇒ 不与定深 PID 打架
    out_max: 0.35        # 上浮/下潜幅值上限（占位·未标定）
    deadzone_m: 0.02     # 死区滞环：贴边不来回抖
  # ---- 指定角度轴动作（协议 byte[7]：2=pitch / 3=roll）----
  pitch: {up_deg: 0.0, up_sign: 1.0, timeout_s: 8.0, settle_ms: 300.0}
  #   up_sign = **-1.0 是现场单轴实测值**（负相对角 = 抬头；2026-10-06 用户上板实测后定，
  #   2026-10-07 复确认）。
  #   ⚠️ 改它 / 换下位机固件 / 换 IMU 安装，都要重新单轴实测：
  #   `python3 common/motion/turn_deg.py --axis pitch --deg 5`（小幅、看机头往哪边走）
  level: {timeout_s: 8.0, settle_ms: 300.0}
  #   回水平：相对角按遥测算 = wrap180(抬头前测到的 pitch − 当前 pitch)，**不写死 −30°**
  roll:  {dump_deg: 30.0, dump_sign: 1.0, timeout_s: 8.0, settle_ms: 300.0}
  #   dump_sign ⚠️**未验证**：横倾正负 vs 物理倒向哪一侧
  # ---- 定时推力动作（被动收球笼：无执行器通道，收球靠机身下压+上升）----
  dip:  {heave: -0.35, dur_s: 1.2}      # 占位·未标定：下压收球
  rise: {heave: 0.30, dur_s: 1.5}       # 占位·未标定：上升带走球
  #   ↑ 本任务（三）**不自动放球**：验色通过即结束；运输交接看 `GrabTask.holds_ball`。
  retry: {assume_ok: true, assume_ok_after: 2, max_dumps: 1}
  #   用户定：比赛只有两个球 ⇒ 第 2 次尝试默认是对的、直接过；max_dumps = 倒球重来次数上限
  # ---- 丢目标 / 对准 / 接近（判据量 = 圆面积占比 πr²/(W·H)，不是 bbox）----
  lost: {grace_frames: 15, hold_s: 0.8, ema_alpha: 0.3}
  center: {eps: 0.20, confirm_frames: 5, surge_ratio: 0.65}
  #   ⚠️ surge_ratio 让前进幅值 = pid_sway.out_max × 该值：0.24×0.65 = **0.156**
  #      —— 刚好在执行器死区 0.138 之上（0.5 会算成 0.12，**完全推不动**，那就不是"很慢"而是"不走"）。
  #      居中要更慢请拧 `duty.duty_surge_center`（幅值别再降）。
  #   ★ **通道 = sway（平移）**：2026-10-06 用户定「夹取任务不需要旋转」⇒ 居中不再用 yaw。
  #     （原名 `center_yaw`：最早的口令是「先调 yaw 居中」，现已改；要回退就把 phases.py 的
  #      `_step_center` 改回 yaw 送出，并把这里换成 yaw 量级的增益 kp≈0.25/out_max≈0.15）
  #   ⚠️ kd 必须 0（`search_scan` 同坑：下视 ~20fps 下 D 项易自激）；kp/eps 占位·未标定
  approach: {surge_fast: 0.15, surge_slow: 0.08, slow_ratio: 0.12, growth_eps: 0.002,
             dip_ratio: 0.15, confirm_frames: 2}
  #   surge 两档 2026-10-07 由 0.25/0.12 减半（用户「太快」）；sway 由 `grab.pid_sway` 统一给
  #   占位·未标定；dip_ratio = "够近了（该回水平了）"的圆面积占比阈值
  align_level: {eps_x: 0.15, eps_y: 0.20, confirm_frames: 4,
                surge: {kp: 4.0, ki: 0.0, kd: 0.0, out_max: 0.12, deadzone: 0.03}}
  #   sway 由 `grab.pid_sway` 统一给（三个平移相位同一套）
  #   ★ 回水平后的对准（用户 2026-10-06 定）：dx→sway、dy→surge，**两个通道都轻微**（抗水波），
  #     不用 yaw。out_max 故意小 = "轻微调整"；占位·未标定
  verify: {enable: true, roi: [0.25, 0.35, 0.5, 0.5], red_percent_min: 0.30, confirm_frames: 3}
  #   ★ 验色 = 在**下视画面**的笼区 ROI 里读目标色像素**占比 percent**（用户口径）。
  #   roi = [x0, y0, w, h]（占整幅比例）；roi / red_percent_min 占位·未标定

place:  # 任务四 放置（运输 → 到点 → 放球；**与任务三并列的第二大功能块**）
# ⚠️ 未定项都标出来了：'到点'的真实判据、运输通道/速度、以及'IMU roll 0 = 物理水平'都未验证。
# ⚠️ calibrated 是安全闸：false ⇒ 本任务不 ready ⇒ 装配层跳过（不占状态机、不发指令）。
  calibrated: false      # ★ 安全闸：false ⇒ 跳过本任务
  # ★ 2026-10-07：**无兜底** ⇒ place 也必须有 depth_hold（DepthHold 直接 req_node）
  depth_hold: {enable: true, target_m: 0.55, band_lo_m: 0.5, band_hi_m: 0.6,
               kp: 1.0, out_max: 0.35, deadzone_m: 0.02}
  timeout_ms: 60000      # 任务级兜底（放球 3s + 运输占位 30s 的余量）
  depth_floor_m: 0.8     # 任务级有效限深下限（**只抬不降**）；全局限深 0.50 是另一条、不动它
  transport_s: 30.0      # 占位·未标定：运输时长；真正的'到点'判据待定（或调 task.arrived()）
  surge: 0.25            # 占位·未标定：运输速度（通道同 ball/gate 的 surge）
  roll_target_deg: 0.0   # ⚠️ 未验证：IMU roll 目标（0 = 机身水平）——'滚不出来'靠它
  roll_tol_deg: 5.0      # 允许的横倾偏差；超了就重新回正
  relevel_min_s: 2.0     # 两次回正之间至少隔这么久（别把转角指令刷爆）
  stop_s: 3.0            # 放球后停动力（用户定：3s）
  roll: {dump_deg: 30.0, dump_sign: 1.0, timeout_s: 8.0, settle_ms: 300.0}
  #   ↑ 放球横倾角（用户定 30°）；dump_sign ⚠️未验证（与任务三同一个物理方向）
  #   放球的**步骤表**在 `comm.motion.drop.release`（跨任务共用）；要单独一套就在下面覆盖：
  # drop: {release: {steps: [...]}}
ball:  # 任务一 撞球：运动链 SEARCH→CENTER→APPROACH→DASH→STOP
  ema_alpha: 0.3  # 面积占比 EMA 平滑(判据与日志都用它, 抗单帧抖动)
  lost_grace_frames: 15  # 丢目标后的"短时保持/惯性"帧数
  r_slow: 0.12  # 面积分级: >=该值且增长缓慢 → 用 slow; 其余用 fast
  growth_eps: 0.002  # 面积增长阈值: 增长快 → 用 fast(说明在快速接近)
  align_x: true  # 居中通道：x → yaw
  align_y: true
  timeout_ms: 30000  # 总时限 30s(DASH/STOP 期间不打断, 保证命中与停稳)
  search_spin_s: 0.5  # 旋转 0.5s → 停 1.5s 循环
  search_pause_s: 1.5  # （探测时长 0.5s = 阶段窗口, 不按总时限等比缩; 速度 0.25）
  search_advance_after_s: 4
  search_advance_dur_s: 0.5
  search_advance_surge: 0.25
  center_eps: 0.25  # 水平+竖直居中判据(归一化偏差)
  center_confirm_frames: 5
  edge_yaw_kp: 0.3  # 居中转向 P/D 增益与限幅
  edge_yaw_kd: 0.0
  edge_yaw_max: 0.15
  dash_ratio: 0.15  # 面积(EMA)达标阈值
  dash_confirm_frames: 2
  dash_dur_s: 1.5  # 冲刺时长
  stop_hold_s: 1.0
  engage_hold_s: 0.8

gate:  # 任务二 过门
  timeout_ms: 180000  # 任务级兜底
  pass_target: 2  # 完成计数目标：单门 1
  # ★★ 2026-10-07 用户定（依据 log/rungate_20261006_postsway 的 385 帧实测）：
  #   **对中带按档位分开、并且 px_x > px_y**（原来只有一套 0.15/0.10，与几何和数据都不符）。
  #   数据（主点基准 + 去纵向偏置后，有测量帧各档的目标通过率 60% 分位）：
  #     full  |dx| 中位 0.068 / |dy| 中位 0.105 → px/py = 0.69
  #     width |dx| 中位 0.130 / |dy| 中位 0.055 → px/py = 2.31
  #     coarse|dx| 中位 0.158 / |dy| 中位 0.070 → px/py = 1.86
  #   注意纵向**零点不在 0**：{dyn} 的中位是 −0.30（相机比门中心高 + 抬头），
  #   所以 `dy_target=-0.30` 把纵向量心搬到 0 附近；不做这一步，任何纵向阈值都在偏置上打滑。
  #   `confirm_frames` 4→5：用户定"align 成功 5 帧"(与机身静取交，见 hdg.body_delta_max_deg)。
  align: {confirm_frames: 4, px_x: 0.15, px_y: 0.20, dy_target: -0.10}
  # ★ width 档自己的对中带（2026-10-07 用户定）：数据说 width 档横向误差是纵向的 2.3 倍，
  #   用 full 那套带会把 width 帧全部判成"未对准"。缺键时回退到 align.px_x/px_y（不崩）。
  hdg: {enable: true, tol_deg: 8.0, max_step_deg: 15.0, turn_scale: 0.8, timeout_ms: 30000,
        # ★★ 2026-10-07 用户定：**ψ 先平滑再比 tol**（不要放宽 tol）。
        #   实测：ψ(EMA0.4) 的帧间跳 7.8°，而真实航向(tyaw)帧间跳只 0.33° ⇒ **24 倍**，
        #   ψ 在该频段是噪声主导 ⇒ 用它的分布定 tol 是循环论证（原 8° 曾因此一次都起不来）。
        #   几何上界：tol=8° 在 1.5m 过门距离上带来 21cm 横向漂移（门洞半宽 35cm）；
        #   20° 会带来 55cm（直接出界）。⇒ **tol 保持 8°，把 ψ 先做 psi_ema_frames 帧 EMA**。
        psi_ema_frames: 10,
        # ★★ 2026-10-07 用户定：**转向前必须"机身稳"**（重点是稳机身后再转，不是居中本身）。
        #   实测（触发帧 f17）：|Δtyaw|=0.13°、|Δtrol|=0.24°、|Δtpit|=0.09°（全在中位以下）
        #   而 |Δψ|=26.4° ⇒ 那次起转是被图像噪声推出去的，机身其实是静的。
        #   门限 1.0°/帧 是遥测帧间跳的 ~p65（0.5°/帧 会给 0 个 5 帧窗口，太严）；
        #   判定为**并行**：最近 confirm_frames 帧**同时**满足 align 与"机身静"。
        body_delta_max_deg: 1.0,
        # ★ ok_frames（2026-10-04 用户定）：**连续多少帧** ψ 都在 tol_deg 内才算"航向已 OK"。
#   （细节与实测见 doc/注释历史.md）
        ok_frames: 5,
        turn_timeout_s: 8.0,         post_sway_ms: 600.0, post_sway: 0.20,
        post_sway_back: 0.15, post_sway_kpt_min: 2,
          turn_period: 0.05, stop_hard: true,
        max_turns: 3,
        # ★ post_sway_settle_frames（2026-10-06 用户定）：转向后**先连停这么多帧再看画面**
        #   —— 转向后前几帧还是转向前的旧画面，拿它判"门回来了"没意义（实测帧18仍报 kpt=4）。
        post_sway_settle_frames: 8}
  loiter: {enable: true, near_ratio: 0.50, timeout_ms: 6000, dx_max: 0.25, dy_max: 0.30, pose_hist_ms: 1500.0, pose_hist_min: 3}
  z: {align_max: 3.0, fast_max: 3.0,
      # ★★ 2026-10-07 用户定：**三个"到门口"的距离键直接划等号** ——
      #   `z.slow_max`（近了就慢） / `z.cross`（冲刺触发） / `width.z_max`（width 档"够近了"）。
      #   ⚠️ 用 **YAML 锚点**实现：**只改下面 `&door_m` 这一处**，三个键同时变；
      #     历史上它们是手工写成同一个数（09-30 起 cross/slow_max 都是 1.2），
      #     散在三个地方、改一个忘一个 ⇒ 现在钉成一个来源。
      #   物理含义：门框在画面里大到这个程度 = 已到门口。
      #   ★ 2026-10-07 用户定：值 1.2 → **1.5**（"近端 z 适当放大，利于果断冲门"）。
      #   数据依据：full 档 z<1.5 的 9 帧里 k=z×ratio 的 std 只有 3.3%（z∈[1.5,2.0) 是 3.7%），
      #   是全程最稳的一段；把冲刺门限放到 1.5，参与 z≤cross 计数的帧从 14 → 22、最长连续 7 → 11 帧，
      #   而 cross_confirm_frames=4 的要求才第一次真正可满足。
      #   远端侧（>3m）无动作空间：z 实测在 1.958–3.123 之间是空带，
      #   dist_max_m / relock_away_m 取该区间内任何值行为完全相同。
      slow_max: &door_m 1.5,
      cross: *door_m,
        # ★ dist_max_m：z 超过它 ⇒ **完全不相信**这一帧位姿
        #   ★ 2026-10-07 用户定：**保持 2.5**（"3 米开外测距不准，但远端阈值不放大"）。
#   （细节与实测见 doc/注释历史.md）
        dist_max_m: 2.5,
      cross_confirm_frames: 4,  # 连续 z≤cross 帧数才判过门(防单帧 PnP 错解冲出去)
      # ★ 与 cross 同值：近了就进 THROUGH，不会因为太近而长时间 search/back_slow
#   （细节与实测见 doc/注释历史.md）
      # ★★ 2026-10-07 用户定：**面积参照模型可切换**（丢门重锁那套 `_relock_ratio_ref`）。
      #   · interframe = **帧间占比突变**：参照=上一帧被采纳的占比 ⇒ 只挡单帧骤降（>30%），
      #                  船正常往回退不会被误判；真实的渐变萎缩也拦不住。
      #   · preloss    = **丢门前占比突变**：参照在丢门那一刻固定、跨丢门比较 ⇒ 能挡住
      #                  "丢门→远处门出现"这一类，但丢门后若正常位姿变化会偏严。
      #   · ema        = **平滑跟踪**：参照 = 0.7×旧 + 0.3×本帧（抗单帧抖动，又跟得上真实变化）。
      relock_ratio_model: ema,
      relock_far_ratio: 0.7,  # 重锁保护的**占比退路**（门回来但占比小于它 × 参照 ⇒ 继续重锁）：
      relock_z_jump_m: 0.5,  # ★ z 跳变保护：**只挡向上跳**（同一扇门不可能突然远 0.5m；向下/更近正常）。
      relock_away_m: 1.8,  # ★ 丢门重锁时 z 超过它 ⇒ 判为「下一个门」
      near_lost_ratio: 0.50,
      }
  # ★ approach（2026-10-06 用户定）：进近（APPROACH）相位用哪个速档。
  #   `creep` = 舍弃 forward_fast，**到达 z.cross 前一律慢速试探**（撞门代价不可逆）。
  approach: {tier: creep}
  surge: {creep: 0.20, lost_backward: 0.20, reacquire: 0.25, through: 0.6}
  width:  # width 档
    z_max: *door_m   # ★ 与 z.cross / z.slow_max 同一个值（YAML 锚点，改 &door_m 一处即可）
    # ★ 2026-10-07 用户定：width 档**自己的**对中带（各 mode 的居中依赖不同，不共用一套）。
    #   数据（主点基准 + 去纵向偏置，width 有测量 68 帧）：|dx| 中位 0.130 / |dy| 中位 0.055
    #   ⇒ 60% 分位给 (0.14, 0.06)。缺键时回退到 align.px_x/px_y。
    align_x: 0.15
    align_y: 0.10
  # ★ 2026-10-07 用户定：coarse 档对中带 0.33/0.29 → **0.18/0.10**（原值过松：
  #   实测只有 50% 的 coarse 帧落进去，且落在阈值附近的帧最多——收紧后仍覆盖 60% 分位）。
  # ★ 2026-10-07 用户定：coarse 档 HOLD **超时 5s 就触发后退**（原来按帧数 20 帧≈2s，偏紧）。
  #   后退时**按可见角点引导**（见 modes.py::_tick_reacquire）：
  #     · 只见下边角(BL/BR) ⇒ 门在视野上方 ⇒ **上浮**一点（用户原话：只看到 BR 就边退边浮）
  #     · 只见上边角(TL/TR) ⇒ 门在下方 ⇒ 下潜一点
  #     · 够 **2 个角点（进 width）就收手**，不追求 full ✓
  #   `back_heave` 必须**高于执行器死区 0.138** 才有推力（0.20 留了余量）。
  coarse: {far_ratio: 0.18, near_ratio: 0.55, align_x: 0.18, align_y: 0.10, hold_timeout_ms: 5000, back_heave: 0.20}
  hold: {max_frames: 20}  # HOLD 无进展帧数 → REACQUIRE(只在"未对准"时累加)
  reacquire: {max_ms: 800,  # 单次后退上限(ms)
              max_times: 2,  # 连续这么多次仍拿不到角点 → 放弃后退, 改原地 HOLD
              stop_ratio: 0.75,  # 闭环后退: 框占比退到进入时的 75% 就停
              reset_after_ms: 3000}  # 距上次后退超过这么久 → 重新允许 max_times 次后退
  # ★★ 2026-10-07 用户定：**过门必须在"各档位自己的居中范围"内触发**。
  #   `loose` = 本档对中带 × 它（**1.0 = 完全等同该档的居中要求**；>1 才允许比对准更松）。
  #   它与下面的 `center_x/center_y`（2026-10-05 定的"抗抖动上限"）取 **AND**
  #   ⇒ 两道都过才许冲，所以这条只会更严，不会把旧闸放松。
  # ★★ 2026-10-07 用户定：**两段式冲刺**（见 exits._tick_through 的注释）。
  #   段① `fast_ms` 用 `surge.through` 快冲；段② 到 `confirm_ms` 降到 `surge.creep` 保持。
  #   `cross` 1.2→1.5 之后起冲点更远，而 confirm_ms 原 2000ms 只够走 0.6~1.0m。
  #   ★ 2026-10-07 用户定：**快冲 2s + 慢冲 4s**（共 6s）。
  #   按 `surge=0.30→17.3cm/s` 外推（0.60 ⇒ 0.29~0.49 m/s；creep 0.20 ⇒ 0.066~0.108 m/s）：
  #     段① 2s ≈ 0.58~0.98 m ；段② 4s ≈ 0.26~0.43 m ；合计 ≈ **0.84~1.41 m**。
  #   ⚠️ 这个覆盖面小于"cross(1.5)+艇长+余量 ≈ 2.4~2.6 m"的几何估算 ⇒ 若实测冲不过去，
  #      优先加段①（快冲段是唯一能大幅加距离的一段）。`fast_ms: 0` = 整段满速（旧行为）。
  through: {confirm_ms: 4500, fast_ms: 3000, confirm_frames: 8, require_align_deg: 8.0, loose: 1.0,
            # ★ center_frames（2026-10-05 用户定）：**够近那条主出口**要求"居中成功"
#   （细节与实测见 doc/注释历史.md）
            center_frames: 4, center_x: 0.20, center_y: 0.25}
  creep_through: {creep_ms: 5000}  # 门口过门：coarse/width 门口超时后慢速 creep 冲门时长(ms)
  search: {sweep_s: 2.0, sweep_max_s: 32.0, pause_s: 1.0, sway: 0.6, max_ms: 2000}
  # ★ 选门后**锁定**（2026-10-04 用户定）：未锁定才做 near 选门；锁定后只跟同一扇，
#   （细节与实测见 doc/注释历史.md）
  lock: {match_ratio: 0.20, miss_frames: 5, stable_frames: 5}
  # ★ 选门：z 与**框占比**配合判据（2026-10-04 用户定）。
#   （细节与实测见 doc/注释历史.md）
  # ★ 2026-10-07 用户定：k 一致性带宽按**实测两个总体**改（0.75/1.40 → **0.30/1.45**）。
  #   实测 k=z×ratio 在数据上只有两群：低群 0.150–0.251（中位 0.211）、高群 0.593–1.008（中位 0.768）。
  #   同门正常波动（width 0.693–1.008 ÷ 参照 0.78）只有 ×0.89~×1.29 ⇒ 落在带内；
  #   而 f65→f66 那次"单帧塌陷"把 k 打到 0.150（÷参照 = ×0.19）⇒ 新下限 0.30 能拦住它。
  select: {k_check: true, k_lo_ratio: 0.30, k_hi_ratio: 1.45, k_max_ratio: 0.90}   # 选门 = z 优先 + 面积最大 + k 一致性保护
  # ★★ 2026-10-07 用户定：**竖直通道限幅** —— 不管 PID 算出多少，heave 都不超过它。
  #   为什么：竖直 PID 的 D 项在"门刚进画面"那一帧会有 0.45 的尖峰（实测 0.15×0.30/0.1s），
  #   heave 一帧打到 −0.75 ⇒ 船"猛下沉"；而**限深保护只管防上浮**（≤min_depth 禁止上浮），
  #   下潜方向原本没有任何闸。这条就是那道闸。
  #   0.35 ≈ 竖直 PID 满幅的 1/3，够压住下沉/上浮，又不至于让对中动不了。0=不限。
  heave_max: 0.35
  pose_hold_frames: 10  # 帧间防抖：丢姿态时的保持帧数

debug:  # 通信调试
  tx_frame_hex: true  # 终端打印每次发出的 11B 运动帧
  tx_frame_log_ms: 0  # 打印/遥测节流(毫秒，200=5Hz
  tel_log_ms: 200
