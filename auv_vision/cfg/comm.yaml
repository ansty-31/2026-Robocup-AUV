# comm.yaml — 通信 / 底层运动 / 任务参数（**参数唯一来源**）
# 注释只写"是什么 + 当前值"；**注意事项（⚠️）、实测证据、历史沿革全部在 `doc/注释历史.md`**。
# 约定：ball/gate 共用参数只写 `motion` 段，任务段只在"确实要单独一套"时写覆盖键。

serial:
  device: /dev/ttyS1
  baud: 9600

frame:  # 11B 定长帧
  header: 165  # 0xA5
  axis_count: 7
  btn_count: 3
  axis_mid: 128
  axis_range: 127
  aux_axis: {4: 165, 5: 1, 6: 1}  # axis4=滚轮静止/中值, axis5/6=tri 中位
  btn_values: [0, 0, 0]  # 当前下位机固件未使用

dof_map:  # DOF→轴字节真值表
  surge: {axis: 1, sign: 1}  # 前后←LY、左右平移←RY、升降←RX、旋转←LX
  sway:  {axis: 3, sign: 1}
  heave: {axis: 2, sign: 1}
  yaw:   {axis: 0, sign: 1}

heartbeat:
  interval_ms: 50  # 心跳间隔(ms)，≥20Hz
estop:
  repeat_ms: 30  # 急停连发中性帧间隔(ms)
watchdog:  # ★ **轴饱和看门狗**
  enable: true  # 独立线程
  axes: [yaw]  # ★**只盯哪些轴**
  max_same_dir_s: 10.0  # 同一轴、**同一方向**连续发轴超过这么多秒 ⇒ estop 硬停 + 强制退出(9)
  min_off_b: 13  # 偏离中位超过这么多**字节**才算"在发轴"
  poll_ms: 50  # 巡检周期(ms)
ramp:
  speed_per_s: 220.0  # 轴字节平滑速率(字节/秒)：速度连续变化到目标，不是直接激增

telemetry:  # 下位机上行姿态/深度的**符号归一**
  yaw_sign: 1.0  # 遥测 yaw × 它
depth_guard:  # 限深保护：只压上浮，不动前进/转向
  enable: true  # 当前深度 ≤ min_depth_m → 本帧 heave 清零并当帧回中，机身顶不出水面
  min_depth_m: 0.55  # ⚠️ **现场定死 = 0.55，不准改**
  stale_ms: 500  # 遥测超过这么久(ms)没更新 → 视为没有深度
  stale_action: pass  # 无新鲜深度时：pass=放行(台架/仿真友好) | block_up=连盲上浮也不许
  snap: true  # 触发时 heave 轴当帧直接回中
  log_ms: 1000  # 触发告警打印节流(ms

dof_comp:  # **底层共用**：单独调"下潜"这一路动力
  enable: true  # 只对 heave<0
  dive_scale: 2.0  # 下潜指令 × 它再夹到 [-1,0]

motion:  # **ball / gate 共用的底层运动参数**
  pid_sway:  {kp: 8.0, ki: 0.01, kd: 0.05, out_max: 0.45, deadzone: 0.05}
  pid_heave: {kp: 1.0, ki: 0.0,  kd: 0.15, out_max: 1.0,  deadzone: 0.04}
  turn_pid: {kp: 0.2, ki: 0.0, kd: 0.0, out_max: 0.30, deadzone_deg: 6.0, norm_deg: 15.0,
             div_deg: 15.0,
             sat_max_s: 2.0, sat_progress_deg: 5.0,
             overshoot_tol_deg: 10.0,
             period: 0.05}
  surge_fast: 0.35  # 快档：ball 分级最高速/冲刺、gate 远距进近
  surge_slow: 0.15  # 慢档：ball 接近段减速、gate 近距进近
  loss_inertia_surge: 0.25  # 目标短时丢失时的低速惯性
  search_yaw: 0.3  # 无目标时原地旋转搜索
  presets:  # 手动模式/急停用的 DOF 预设
    stop:         [0.0, 0.0, 0.0, 0.0]
    forward_fast: [1.0, 0.0, 0.0, 0.0]
    forward_slow: [0.35, 0.0, 0.0, 0.0]
    backward:     [-0.5, 0.0, 0.0, 0.0]
    left:         [0.0, -1.0, 0.0, 0.0]
    right:        [0.0, 1.0, 0.0, 0.0]
    up:           [0.0, 0.0, 1.0, 0.0]
    down:         [0.0, 0.0, -1.0, 0.0]
    turn_left:    [0.0, 0.0, 0.0, -0.4]
    turn_right:   [0.0, 0.0, 0.0, 0.4]
    search:       [0.0, 0.0, 0.0, 0.3]  # 右转

tasks:
  enabled: [ball]  # 任务一
  fault_action: skip  # 模型缺失等：skip | exit
  idle_ms: 1000
  done_hold_ms: 500

ball:  # 任务一 撞球：运动链 SEARCH→CENTER→APPROACH→DASH→STOP
  ema_alpha: 0.3  # 面积占比 EMA 平滑(判据与日志都用它, 抗单帧抖动)
  lost_grace_frames: 15  # 丢目标后的"短时保持/惯性"帧数
  r_slow: 0.12  # 面积分级: >=该值且增长缓慢 → 用 slow; 其余用 fast
  growth_eps: 0.002  # 面积增长阈值: 增长快 → 用 fast(说明在快速接近)
  align_x: true  # 居中通道：x → yaw
  align_y: true
  timeout_ms: 30000  # 总时限 30s(DASH/STOP 期间不打断, 保证命中与停稳)
  search_spin_s: 0.5  # 旋转 0.5s → 停 1.5s 循环
  search_pause_s: 1.5  # （探测时长 0.5s = 阶段窗口, 不按总时限等比缩; 速度 0.25）
  search_advance_after_s: 4
  search_advance_dur_s: 0.5
  search_advance_surge: 0.25
  center_eps: 0.25  # 水平+竖直居中判据(归一化偏差)
  center_confirm_frames: 5
  edge_yaw_kp: 0.3  # 居中转向 P/D 增益与限幅
  edge_yaw_kd: 0.0
  edge_yaw_max: 0.15
  dash_ratio: 0.15  # 面积(EMA)达标阈值
  dash_confirm_frames: 2
  dash_dur_s: 1.5  # 冲刺时长
  stop_hold_s: 1.0
  engage_hold_s: 0.8

gate:  # 过门
  timeout_ms: 180000  # 任务级兜底
  pass_target: 4  # 完成计数目标：单门 1
  align: {confirm_frames: 4, px_x: 0.20, px_y: 0.25}  # 现用值
  hdg: {enable: true, tol_deg: 8.0, max_step_deg: 15.0, turn_scale: 0.8, timeout_ms: 30000,
        turn_timeout_s: 8.0, entry_psi_first: false, psi_first_z_max: 2.5, psi_first_ratio: 0.30,
        post_sway_ms: 600.0, post_sway: 0.20,
        post_sway_back: 0.15, post_sway_kpt_min: 2,
        post_sway_far_ratio: 0.7, post_sway_same_z_m: 0.5, stop_hard: true}
  loiter: {enable: true, near_ratio: 0.60, timeout_ms: 3000, dx_max: 0.14, dy_max: 0.20}
  z: {align_max: 4.0, fast_max: 3.0, slow_max: 1.3, cross: 1.0,  # 2026-09-28：0.7→0.9
      cross_confirm_frames: 2,  # 连续 z≤cross 帧数才判过门(防单帧 PnP 错解冲出去)
      near_lost_m: 1.2,  # ★ 现用 1.2
      near_lost_ratio: 0.50,  # ★ 现用 0.50
      z_stale_ms: 1500}  # `_z_last` 的"保鲜期"(ms)：超过它未更新 → 不许参与穿门判定
  surge: {creep: 0.20, lost_backward: 0.20, reacquire: 0.25, through: 0.6}
  width:  # width 档
    z_max: 1.5  # 粗测距 z ≤ 它 = 够近了，此时只允许 creep 靠近
  coarse: {far_ratio: 0.18, near_ratio: 0.55, align_x: 0.33, align_y: 0.29}
  hold: {max_frames: 20}  # HOLD 无进展帧数 → REACQUIRE(只在"未对准"时累加)
  reacquire: {max_ms: 800,  # 单次后退上限(ms)
              max_times: 2,  # 连续这么多次仍拿不到角点 → 放弃后退, 改原地 HOLD
              stop_ratio: 0.75,  # 闭环后退: 框占比退到进入时的 75% 就停
              reset_after_ms: 3000}  # 距上次后退超过这么久 → 重新允许 max_times 次后退
  through: {confirm_ms: 3000, near_lost_confirm_ms: 5000, confirm_frames: 8, require_align_deg: 8.0}
  search: {sweep_s: 2.0, sweep_max_s: 32.0, pause_s: 1.0, sway: 0.6}
  pose_hold_frames: 10  # 帧间防抖：丢姿态时的保持帧数

debug:  # 通信调试
  tx_frame_hex: true  # 终端打印每次发出的 11B 运动帧
  tx_frame_log_ms: 0  # 打印/遥测节流(毫秒，200=5Hz
  tel_log_ms: 200
