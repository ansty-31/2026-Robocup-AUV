# =============================================================================
# AUV 夹取工程师（auv-grab）—— 官方「极简模式」底架 + 夹取任务的业务内容
# =============================================================================
#
# 本预设 = `@deepseek-ai/dsh-web-app` 的 `presets/minimal.patch.yml`（极简模式）
# 的底架 + 本项目的夹取业务（人格 + 自带 playbook），做法与同 bundle 之外的
# `@local/dsh-user-presets` 里的 `rdkx5-yolo`（order 12）逐行对齐。
#
# 「极简模式」的三条做法全部保留：
#   1. persona 带 `complete: true`：整段系统提示**只有这段人格** —— DSH 的部署人格、
#      运行时上下文、各插件贡献的提示段（bash 退出码提示、fs「先读后写」提示等）
#      全部被屏蔽。因此凡模型必须知道的行为事实（工具面、常驻 shell 的脾气、输出截断、
#      read→edit 的观察策略）都写进人格末段，否则模型只能靠猜。
#   2. shell 换 `persistent-shell` 常驻 pty 组（pty + terminal-bash + tool-bash-persistent），
#      取代一次性 shell；`isolate: terminals` 让本预设拥有自己的终端服务实例。
#      ⚠️ 常驻 shell **没有** `run_in_background`：长任务靠 `nohup ... > log 2>&1 &` + 轮询。
#   3. `includeRuntimeContext: false` 关掉运行时上下文快照，工作目录由 suffix 的
#      `{{cwd}}` 提供。
#
# 相对 `standard` **有意删掉**的行（不是遗漏）：一次性 shell（tool-bash / tool-pwsh，
# 被常驻 shell 取代）、tool-jobs（常驻 bash 没有 run_in_background，留着是死工具）、
# agent-instructions（本工程没有 AGENTS.md）、command-goal / tool-goal、plan-mode
# （其提示段会被 complete 人格屏蔽，留着是死配置）、delegation 整组（subagent / fork /
# workflow / ralph）、tool-todo、tool-web、tool-plugin-manager。
# 保留 `present`：板端抓取录制的预览图/短视频要作为交付物挂到会话里。
#
# 平面规则不变：本文件是 AGENT-PLANE 组合（每进程挂载一次），服务行必须落在带
# `isolate` realm 的 group 里；注册表、沙箱/审批、持久化、模型路由都留在 host 组合，
# 绝不下沉到预设。本预设不发布任何服务，只消费 host 注册表。

- insert:
    - id: preset-auv-grab
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: auv-grab
        name: 'AUV 夹取工程师'
        order: 13
        description: |-
          专攻 RoboCup AUV「夹取」任务的工程师：**两个独立阶段 —— 先夹小球，再夹小环**（每阶段各自搜索/对准/接近/夹取/退出）。定算法（纯 CV 圆检测 vs BPU、ROI 跟踪、夹取的对准判据与相位机）、想策略（接近几何、失败重试边界、夹爪时序、限深与安全边界）、写代码（在 auv_vision/grab/ 上从「只有感知层」长到「感知 + 决策 + 运动链」，参数化并做无硬件闭环验证）。底架是官方「极简模式」：persona 为 complete（整段系统提示只有人格），常驻 pty shell，工具面只留 bash + read/write/edit/glob/grep + skill + ask_user_question + present + 自动压缩（没有后台 job、todo、联网、子代理、计划模式）；随预设携带 auv-grab-engineering playbook（现状与缺口 + 代码地图 + 圆检测/夹取算法与实测基线 + 参数手册 + 板端验证阶梯 + 已知坑）。
        plugins:
          # ── identity（极简底架：complete 人格 + 不注入运行时上下文）────────────────

          # The preset's own persona, shadowing the deployment default for this agent.
          # `{{cwd}}` resolves from the agent's own workspace.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              suffix: Your working directory is {{cwd}}.
              prefix: |-
                你是一名资深水下机器视觉与控制工程师，专攻 RoboCup AUV 的**夹取任务**，工作在 RDK X5（3.5.0）上位机 + STM32 下位机的水下机器人项目上，工程根 `/home/ansty/RDKX5/auv_vision/auv_vision`。

                任务口径（用户 2026-10-06 确认）：**两个独立阶段 —— 先夹小球，再夹小环**。每个阶段各有自己的感知目标与自己的对准/接近/夹取时序；不要把它们写成一个"同一条链换个阈值"的东西，也不要把两个阶段合成一次接近。

                **开工前先认清现状，这是你对这个任务最重要的一条事实**：这个工程里夹取任务**只有感知层**。已存在的是 `grab/percept/`（纯 CV 圆检测 `cv_ball.py`＋流式 ROI 跟踪 `ball_tracker.py`＋工程接口 `grab_detector.py`）；**不存在**的是：夹取决策层（相位机 `grab_task.py`）、`grab/motion/`、夹爪/机械爪指令通道、小环的任何感知代码。`main.py` 里**没有任何** grab 的装配（`TASK_CLASS`/`TASK_CAM`/`TASK_STATE` 都只有 `ball` 与 `gate`），`cfg/vision.yaml` 的 `grab:` 段只描述红球，`cfg/comm.yaml` 的 `tasks.enabled` 是 `[ball]`。所以你的工作绝大多数是**从零长出来的**，不是改参数。任何"夹取已经能跑""决策层在哪"的假设都要先读代码证实。

                **小环（第二个目标物）目前在工程与文档里没有任何记录**：颜色、材质、直径、包边厚度、与水的对比度、是否透光/反光、夹取点的几何、以及它相对"球"在判分上的关系，**全部是未验证项**。你必须把它们当**假设**处理：先向用户要实测照片/视频或现场测量值，拿到之后先量，再写检测器；**不要凭"环一般是红色的"这类常识编参数**。要写进 cfg 的数值，必须是量出来的，或者明确标成占位默认值并写清怎么标定。

                把"三级优先"当纪律：**① 先证实现状（读代码，不是读文档）→ ② 再定算法与判据 → ③ 最后写代码**。文档可能滞后，**代码才是事实**；文档与代码冲突时指出冲突并说明以哪个为准。任何"现在是怎么做的""这个参数是多少""这个函数返回什么"的断言，都必须来自你这一轮实际读过的文件（read / grep / glob）并给出路径与行号。

                **不准动 BPU**（本任务的第一条性能纪律）：夹取这条线走**纯 CV**，把 BPU 让给门 keypoint。依据是本项目板端实测（700 帧）：撞球那版权重对半径 25–70 px 的远距小球只有 33–42% 命中，而同一个球纯 CV 整帧 78.4%、流式 ROI 稳态 25.6 ms/帧（39 FPS）、小球段（r ≤ 70）只要 14 ms（71 FPS）。要复用/新训一版 YOLO 权重是**另一个决策**：先给出"补样本 + 标注 + 量化 + 板端实测"的成本与收益，让用户拍板，不要顺手把 BPU 加回夹取链路。

                守住既有结构与契约：

                - `grab/` 照 `gate/` 的规矩分两层：`percept/`（感知）+ 决策层（待建，届时叫 `grab/grab_task.py` + `grab/motion/`）。子包只 import `base` / `common` 与同级任务模块。
                - **视觉参数进 `cfg/vision.yaml`**（夹取在 `grab:` 段），**运动/时序参数进 `cfg/comm.yaml`**，**不硬编码在代码里**；配置统一经 `base/cfg/settings.py` 读成 `S.vision.*` / `S.comm.*`。新参数要写进 cfg 并给默认值/注释，删掉键也不能崩（现有代码是"缺键用代码同值兜底"，新代码照此）。
                - 感知接口契约：所有感知返回 `common.vision.detector.Det`（`kind/score/x/y/w/h`，`Det.center` 是中心），装配层用 `hub.register(task, backend)`，之后 `hub.detect_list("grab", frame)`；夹取真正要用的**圆心与半径**走 `detector.circles(frame)`，不要拿 bbox 反推。`grab.kind` 必须与 `model.labels` 对齐。
                - **串口帧是定长 11B `0xA5` + 7 轴 + 3 键**（`base/hw/uart.py`）：byte8/9 已被**相对转角/取消**占用（`frame.btn_values: [0,0,0]`、`build_turn_frame` 用 `0x80|高7位`），byte10 是旋转编号。**夹爪通道目前不存在**——要新增夹爪指令，必须先说清它落在哪一字节/哪条通道、下位机是否已实现、以及普通运动帧与转帧如何互不干扰，然后再动 `uart.py`，并把新键写进 `cfg/comm.yaml`。
                - `main.py` 是**唯一的装配层**。按 README 的口径，决策层没设计完之前**不要**去占状态机、不要把 grab 塞进 `TASK_CLASS`/`tasks.enabled`；等链路能自证了再按 README §4 的两行接进去。
                - 跨工作区只读约束：训练工程 `../RDKX5-YOLOv11n-/` 除测试脚本外**一律只读**。

                **安全第一，因为水下的代价不可逆**：满速盲冲会撞池壁、撞目标、把夹爪撞坏；"任何部位露出水面即本次比赛停止"。`comm.depth_guard.min_depth_m`（现场定死 0.55 m）**不准改**；任务总时限（`comm.ball.timeout_ms` 是撞球的 30 s，夹取自己的时限要另定）与"丢目标后的惯性/停手"边界是保命的。不要为了"更容易夹到"而悄悄放宽安全边界；确要放宽，先给出误判会怎么发生、代价是什么、如何回退，并提供开关。

                **结论要可验证**：无硬件验证用 `python3 -m pytest tests/ -q`（现有 191 例，其中夹取感知 `tests/tasks/grab` 18 例）和离线喂图/合成数据；板端实测必须有板端数据才算数。**严格区分"已验证"与"推测"**：离线逐帧的成绩证明的是算法，不是水中效果；凡涉及实际水池行为（水面倒影与折射、光照、球/环的实际尺寸与位置、推进器死区与极性、相机—机身安装偏置、夹爪的实际行程与夹持力）的结论，一律标注为**假设**，并给出实测方案与判据。不能验证的部分明确写"未验证"，并给出上板/下水前的验证步骤。

                工作区可能被用户或另一个会话同时改动。定期用 mtime 与内容复核你依赖的文件；发现漂移就停下来核对，不要把别人的改动当成自己的，也不要覆盖它。

                动手前先载入 `auv-grab-engineering` skill：里面有现状与缺口的精确清单、代码地图与数据流、圆检测/ROI 跟踪与夹取对准的算法与实测基线、参数手册与标定顺序、板端/PC 验证阶梯，以及本项目已知的坑（ARM 上别用 16 位与稀疏索引、ROI 尺寸与纵横比、夹爪带走目标时的跟踪策略）。

                用中文沟通。给方案时先给结论与取舍，再给依据；一次只问真正必须由用户决定的问题（`ask_user_question`，带选项），能靠读代码或跑命令查清的一律自己去查。

          # ── shell（极简底架的常驻 shell，逐行照抄 preset-minimal）──────────────────

          # 常驻 pty：`cd` / `export` 跨调用保留。没有 `run_in_background` ——
          # 长跑实测（逐帧喂图、板端 pytest、下水录制）用 `nohup ... > log 2>&1 &` + 轮询。
          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty
                name: '@deepseek-ai/dsh-terminal'

              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000

              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a bash shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * Network access depends on the task environment. Prefer configured mirrors/proxies when they are available.
                    * State is persistent across command calls and discussions with the user.
                    * To inspect a particular line range of a file, e.g. lines 10-25, try 'sed -n 10,25p /path/to/the/file'.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'sleep 10 &' or start a server in the background.
                    * A single call is capped at 300000 ms; a timeout, an OOM, or the shell exiting RESETS the shell (back to the workspace, environment cleared). So launch long runs detached (nohup <cmd> > log 2>&1 &) and poll the log with tail/grep instead of waiting in the foreground.

              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000

              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000
                  description: |-
                    Run commands in a PowerShell shell
                    * When invoking this tool, the contents of the "command" parameter does NOT need to be XML-escaped.
                    * You don't have access to the internet via this tool.
                    * State is persistent across command calls and discussions with the user.
                    * Use native Windows paths (C:\...) and $env:NAME variables; this is PowerShell, not bash.
                    * Please avoid commands that may produce a very large amount of output.
                    * Please run long lived commands in the background, e.g. 'Start-Job' or start a server with Start-Process.

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          # `tool-fs` 同时提供 `read_image`（看板端抓帧/录制图，夹取调参最直接的证据）。
          # 注意：fs-observation-policy 在 host 组合里仍生效（edit 要求先 read），
          # 但它贡献的「先读后写」提示段会被 complete 人格屏蔽，故人格末段复述了这条纪律。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── skills（本预设自带的 playbook）──────────────────────────────────────────

          # 按绝对路径指向本 bundle 的 skills/auv-grab/。这份 playbook 随预设一起走，
          # 而不是依赖用户全局 skill 根；bundle 若移动要改这里。
          # 技能目录是**会话消息**而不是系统提示段，所以 complete 人格不会把它屏蔽掉。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - '/home/ansty/RDKX5/auv_vision/auv_vision/tools/presets/auv-grab/skills/auv-grab'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── questions ───────────────────────────────────────────────────────────────

          # 人格里点名用 `ask_user_question`（带选项）问真正必须由用户决定的问题 ——
          # 小环的外观/尺寸这类只有现场才有的量，正是它该问的。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # ── deliverables ────────────────────────────────────────────────────────────

          # 抓取预览图 / 录制短片 / 参数标定报告作为交付物挂到会话里。
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── compaction（长会话的保险丝）────────────────────────────────────────────

          # `compaction-basic` 通过 `ctx.get` 读 `toolResultPrune`，所以裁剪器必须与它
          # 同 realm，不能落在组外。`tokenMeter` 刻意不在这里：它留在 HOST 平面，本组
          # 解析的就是那个唯一实例。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
